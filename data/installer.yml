# What the installers do, step by step, read from the scripts of installer
# 2.0.3 in BIDS-Manager/Installers/ (macOS .command, Windows .bat, Linux .sh).
# Shown as the animated steps on the install page.
steps:
  - id: uv
    title: uv
    all: "Checks for about 2.5 GB of free disk space and a connection to PyPI, lists what it will do and asks you to confirm. Then downloads uv, the program that installs everything else (about 20 MB), and checks it against its published SHA-256 before using it."
  - id: python
    title: Python 3.10
    all: "Has that uv download Python 3.10 into the same folder. It is not added to your PATH, and no other program sees it."
    windows_extra: "Nor is it added to the Windows registry."
  - id: env
    title: An environment
    all: "Creates an environment for BIDS Manager inside that folder, so nothing it installs touches any other Python on the computer. When you update, the environment you have is kept."
  - id: install
    title: BIDS Manager
    all: "Installs the newest bids-manager from PyPI with everything it needs, dcm2niix and niimath included (about 1.5 GB). This is the long step; updates later are much quicker."
    windows_extra: "Then checks that EyeLink files can be read, and says so if they need the Microsoft Visual C++ 2008 runtime."
  - id: launcher
    title: A launcher
    macos: "Puts BIDS-Manager.app in ~/Applications, and an uninstaller on the Desktop."
    windows: "Puts BIDS-Manager and Uninstall BIDS-Manager shortcuts on the Desktop and in the Start menu."
    linux: "Adds BIDS Manager and Uninstall BIDS Manager to the application menu and to the Desktop."
