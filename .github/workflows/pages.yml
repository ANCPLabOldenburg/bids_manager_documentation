# Builds the site with tools/build.py and deploys _site to GitHub Pages on
# every push to main. The build refuses to run (--release) while a download
# link in site.yml is empty or any page lacks a figure, so a half-finished
# site is never published.
#
# Pages must be set once in the repository settings:
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions

name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the build's requirements
        run: pip install -r requirements.txt

      - name: Build the site
        run: python tools/build.py --release --analytics

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
