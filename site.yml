# The site in one file: its name, where it lives, the release it documents,
# every download link, and the navigation. tools/build.py reads it.

title: BIDS Manager
description: >-
  Documentation for BIDS Manager, a GUI and a set of commands
  that turn raw MRI, PET, MR spectroscopy, EEG, MEG, physiological and
  eye-tracking recordings into a BIDS dataset, then validate, view, check and
  edit it.
base_url: https://ancplaboldenburg.github.io/bids_manager_documentation/
version: "1.5.2"
release_date: "October 2026"
repo: https://github.com/ANCPLabOldenburg/BIDS-Manager
docs_repo: https://github.com/ANCPLabOldenburg/bids_manager_documentation
docs_repo_branch: main
pypi: https://pypi.org/project/bids-manager/
analytics: https://bids-manager.goatcounter.com/count

# Every download in one place. A sample whose zip has no public link yet has
# an empty url: the pages then describe it without a download button, and the
# build lists it under "missing downloads". `build.py --release` refuses to
# build while any is missing, unless the entry says `coming_soon: true`: then
# the page says the download is coming soon and the release build goes ahead.
downloads:
  installers:
    url: https://github.com/ANCPLabOldenburg/BIDS-Manager/raw/main/Installers/Installers.zip
    label: Installers.zip
    goatcounter: download-installers-zip
  multimodal:
    url: https://cloud.uol.de/s/kY9nQwdzgyQF6At/download
    file: BIDS_Manager_multimodal_sample_v2.zip
    size: 126 MB
    unpacked: 318 MB
    goatcounter: download-dataset-multimodal
  meg:
    url: https://cloud.uol.de/s/XQoEqsa42bNQ4JX/download
    file: MEG_Elekta_sample_data_small.zip
    size: 474 MB
    unpacked: 853 MB
    goatcounter: download-dataset-meg
  pet:
    url: https://cloud.uol.de/s/Sfmdo6m2GCrKyfi/download
    file: BIDS_Manager_PET_sample.zip
    size: 9 MB
    unpacked: 29 MB
    goatcounter: download-dataset-pet
  eeg:
    url: https://cloud.uol.de/s/8YcmPwFJ5qzfEAq/download
    file: EEG_motor_imagery_sample_data.zip
    size: 36 MB
    unpacked: 67 MB
    goatcounter: download-dataset-eeg
  mri:
    url: https://cloud.uol.de/s/qpE8KeBpqgTn2LB/download
    file: MRI_sample_data_neuroimging_unit_oldenburg_2.zip
    size: 346 MB
    unpacked: 603 MB
    goatcounter: download-dataset-mri
  mri_advanced:
    url: https://cloud.uol.de/s/KdFzsDtLA9ijNAb/download
    file: MRI_sample_data_neuroimging_unit_oldenburg_1.zip
    size: 4.7 GB
    unpacked: 8.0 GB
    goatcounter: download-dataset-mri-advanced

